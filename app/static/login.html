<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<title>登录 · Hermes 模型接入控制台</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel-2: #1c2330;
    --fg: #e6edf3; --muted: #8b949e; --border: #30363d;
    --accent: #58a6ff; --bad: #f85149;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
         background: var(--bg); color: var(--fg);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
         font-size: 14px; line-height: 1.55; }
  .card { width: min(380px, 100%); background: var(--panel); border: 1px solid var(--border);
          border-radius: 14px; padding: 26px 24px; box-shadow: 0 18px 40px rgba(0,0,0,.35); }
  h1 { margin: 0 0 4px; font-size: 18px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 20px; }
  label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
          background: #0b0f14; color: var(--fg); font: inherit; font-family: ui-monospace, Consolas, monospace; }
  input:focus { outline: none; border-color: var(--accent); }
  button { width: 100%; margin-top: 16px; font: inherit; font-size: 14px; font-weight: 600;
           padding: 10px 14px; border-radius: 8px; cursor: pointer; color: var(--accent);
           background: rgba(88,166,255,.12); border: 1px solid var(--accent); }
  button:hover { background: rgba(88,166,255,.2); }
  .err { margin: 0 0 16px; padding: 9px 12px; border-radius: 8px; font-size: 13px;
         color: var(--bad); background: rgba(248,81,73,.12); border: 1px solid rgba(248,81,73,.35); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 18px; line-height: 1.6; }
  code { background: var(--panel-2); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; font-size: 11.5px; }
</style>
</head>
<body>
<main class="card">
  <h1>Hermes <span>模型接入</span>控制台</h1>
  <div class="sub">该页面只应在回环地址或可信局域网、经 SSH 隧道访问。</div>
  <!--ERROR-->
  <form method="post" action="/login" autocomplete="off">
    <label for="token">控制台密码</label>
    <input id="token" name="token" type="password" required autofocus spellcheck="false"
           autocapitalize="off" autocorrect="off" placeholder="data/web/web.token 的内容" />
    <button type="submit">登录</button>
  </form>
  <p class="hint">
    密码保存在容器的 <code>/data/web/web.token</code>（宿主机 <code>data/web/web.token</code>），首次启动自动生成。
    会话 12 小时后失效；脚本可用 <code>curl -u admin:&lt;token&gt;</code> 直接调用 API。
  </p>
</main>
</body>
</html>
