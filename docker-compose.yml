services:
  workbuddy-hermes:
    build:
      context: .
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    image: workbuddy-hermes-stack:local
    container_name: workbuddy-hermes
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 调度策略：expireFirst = 同优先级可用账号按「积分周期到期最早」优先（快到期的先用掉）。
      # 缺省/其他值保持上游轮询；回滚到上游二进制时本变量被忽略，可安全保留。
      WB_SCHEDULING_STRATEGY: "expireFirst"
      GW_PORT: "8317"
      HOST_BIND_IP: "${BIND_IP:-127.0.0.1}"
      HOST_GW_PORT: "${HOST_GW_PORT:-8317}"
      BRIDGE_PORT: "8318"
      WEB_PORT: "8080"
      HOST_WEB_PORT: "${HOST_WEB_PORT:-8080}"
      HOST_BRIDGE_PORT: "${HOST_BRIDGE_PORT:-8318}"
      LOGIN_TIMEOUT: "300"
      # 测试阶段：关闭控制台管理员令牌登录；恢复鉴权删除本行并 docker compose up -d 重建
      WB_CONSOLE_NOAUTH: "1"
    ports:
      - "${BIND_IP:-127.0.0.1}:${HOST_WEB_PORT:-8080}:8080"
      - "${BIND_IP:-127.0.0.1}:${HOST_GW_PORT:-8317}:8317"
      - "${BIND_IP:-127.0.0.1}:${HOST_BRIDGE_PORT:-8318}:8318"
    volumes:
      - ./data/gateway:/data/gateway
      - ./data/web:/data/web
    healthcheck:
      test: ["CMD", "python3", "-c", "import base64,json,urllib.request; t=open('/data/web/web.token').read().strip(); h={'Authorization':('Bas'+'ic ')+base64.b64encode(('admin:'+t).encode()).decode()}; d=json.load(urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8080/api/summary',headers=h),timeout=5)); assert d.get('gatewayAlive')"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
